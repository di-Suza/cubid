services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: development
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 8081
      MONGODB_URI: mongodb://mongo:27017/cubid
      CORS_ORIGIN: http://localhost:5073,http://localhost:5173
      SOCKET_CORS_ORIGIN: http://localhost:5073,http://localhost:5173
      WEB_APP_URL: http://localhost:5073
      JWT_ACCESS_SECRET: dev-access-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
      COOKIE_SECRET: dev-cookie-secret-change-me
    ports:
      - "8081:8081"
    volumes:
      - .:/app
      - api-node-modules:/app/api/node_modules
    depends_on:
      - mongo
      - redis

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: development
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8081/api
      VITE_SOCKET_URL: http://localhost:8081
    ports:
      - "5073:5073"
    volumes:
      - .:/app
      - web-node-modules:/app/web/node_modules
    depends_on:
      - api

volumes:
  mongo-data:
  api-node-modules:
  web-node-modules:
